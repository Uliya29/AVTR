<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>AVTR</title>
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Roboto+Condensed&display=swap" rel="stylesheet">
</head>
<body class="body">
  <header class="header">
    <div class="container">
      <div class="header__top">
        <button class="header__menu">
          <img class="header__nav-img" src="images/menu-btn.svg" alt="Кнопка меню">
        </button>
        <a href="#" class="logo">
          <img class="logo__img" src="images/logo.svg" alt="Логотип">
        </a>
        <ul class="list-contacts">
          <li class="list-contacts">
            <a class="list-contacts__link" href="#">
              <img class="list-contacts__img" src="images/twitter.svg" alt="Логотип Twitter">
            </a>
          </li>
          <li class="list-contacts">
            <a class="list-contacts__link" href="#">
              <img class="list-contacts__img" src="images/google.svg" alt="Логотип Google">
            </a>
          </li>
          <li class="list-contacts">
            <a class="list-contacts__link" href="#">
              <img class="list-contacts__img" src="images/facebook.svg" alt="Логотип Facebook">
            </a>
          </li>
        </ul>
      </div>
    </div>
    <div class="header__cover section">
      <h1 class="title">
        The VISION AVTR
      </h1>
      <p class="title-descr">
        Inspered by the future
      </p>

    </div>
  </header>

  <main class="content">
    <section class="concept section">
      <div class="container">
        <div class="concept__inner">
          <h3 class="concept__title section__title">
            concept
          </h3>
          <p class="concept__text">
            Электромобильность в гармонии с человеком и природой. Экологичная технология органических аккумуляторов и продуманная операционная стратегия концепт-кара VISION AVTR.
          </p>
          <img src="images/concept.jpg" alt="Concept" class="concept__img">
        </div>
      </div>
    </section>

    <section class="premier section">
      <div class="container">
        
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <a class="footer__link" href="#">
          Политика конфиденциальности
        </a>
        <a href="#" class="logo">
          <img class="logo__img" src="images/logo.svg" alt="Логотип">
        </a>
        <ul class="list-contacts">
          <li class="list-contacts">
            <a class="list-contacts__link" href="#">
              <img class="list-contacts__img" src="images/twitter.svg" alt="Логотип Twitter">
            </a>
          </li>
          <li class="list-contacts">
            <a class="list-contacts__link" href="#">
              <img class="list-contacts__img" src="images/google.svg" alt="Логотип Google">
            </a>
          </li>
          <li class="list-contacts">
            <a class="list-contacts__link" href="#">
              <img class="list-contacts__img" src="images/facebook.svg" alt="Логотип Facebook">
            </a>
          </li>
        </ul>
      </div>
    </div>
  </footer>
</body>
</html>
