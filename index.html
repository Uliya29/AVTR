<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>AVTR</title>
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Roboto+Condensed&display=swap" rel="stylesheet">
</head>
<body class="body">
  <header class="header">
    <div class="container">
      <div class="header__top">
        <button class="header__menu">
          <img class="header__nav-img" src="images/menu-btn.svg" alt="Кнопка меню">
        </button>
        <a href="#" class="logo">
          <img class="logo__img" src="images/logo.svg" alt="Логотип">
        </a>
        <ul class="list-contacts">
          <li class="list-contacts">
            <a class="list-contacts__link" href="#">
              <img class="list-contacts__img" src="images/twitter.svg" alt="Логотип Twitter">
            </a>
          </li>
          <li class="list-contacts">
            <a class="list-contacts__link" href="#">
              <img class="list-contacts__img" src="images/google.svg" alt="Логотип Google">
            </a>
          </li>
          <li class="list-contacts">
            <a class="list-contacts__link" href="#">
              <img class="list-contacts__img" src="images/facebook.svg" alt="Логотип Facebook">
            </a>
          </li>
        </ul>
      </div>
    </div>
  </header>

</html>
